<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1018;font-family:"Arial Black",Impact,system-ui,sans-serif;touch-action:none;overscroll-behavior:none;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.zone{position:fixed;top:0;bottom:0;width:50%;z-index:5;display:none;touch-action:none}
#zl{left:0}#zr{right:0}
.pad{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));width:min(28vw,200px);height:min(28vw,200px,32vh);border-radius:30px;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);font:italic 900 clamp(20px,4.5vw,38px) "Arial Black",Impact,sans-serif;display:none;align-items:center;justify-content:center;z-index:6;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.pad.on{background:rgba(255,255,255,.4)}
#pl{left:max(12px,env(safe-area-inset-left))}#pr{right:max(12px,env(safe-area-inset-right))}
#kick{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(22vw,150px);height:min(14vw,80px,14vh);border-radius:18px;border:3px solid #fff;background:rgba(255,120,0,.75);font:italic 900 clamp(18px,3.4vw,28px) "Arial Black",Impact,sans-serif;color:#fff;display:none;z-index:8;touch-action:none}
#kick.dim{opacity:.4}
.tab{position:fixed;left:10px;z-index:9;background:#fff;color:#111;border:3px solid #111;font:italic 900 clamp(18px,3vw,30px) "Arial Black",Impact,sans-serif;padding:2px 22px;display:none;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
#brestart{top:10px}#bexit{top:calc(10px + clamp(40px,5vw,56px))}
#prac{position:fixed;left:10px;top:calc(20px + clamp(80px,10vw,112px));z-index:9;display:none;font:italic 900 clamp(14px,2.2vw,20px) "Arial Black",Impact,sans-serif;text-shadow:0 2px 0 #000}
#prac button{display:block;margin-bottom:6px;font:inherit;background:#fff;border:3px solid #111;padding:2px 10px;cursor:pointer;color:#111}
#prac label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;overflow:auto;display:none;background:radial-gradient(ellipse at top,#1d3a63,#0c1018 70%);padding:14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.wrap{max-width:980px;margin:0 auto}
h1{font:italic 900 clamp(28px,6vw,54px) "Arial Black",Impact,sans-serif;margin:6px 0 2px;text-shadow:3px 3px 0 #d92b2b;letter-spacing:1px}
h1 span{color:#ffd23f}
.sub{opacity:.75;font:600 14px system-ui,sans-serif;margin-bottom:12px}
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font:italic 900 15px "Arial Black",sans-serif;color:#ffd23f;letter-spacing:1px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 12px;font:800 14px system-ui,sans-serif;cursor:pointer;color:#fff}
.chip.sel{background:#d92b2b;border-color:#fff}
.chip.lock{opacity:.45;cursor:not-allowed}
.chip small{display:block;font-weight:500;opacity:.8;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.desc{font:500 13px system-ui,sans-serif;opacity:.85;margin-top:6px;line-height:1.4}
input[type=range]{width:100%;accent-color:#d92b2b}
.big{display:block;width:100%;background:#d92b2b;border:3px solid #fff;color:#fff;padding:14px;border-radius:14px;font:italic 900 26px "Arial Black",sans-serif;cursor:pointer;margin:6px 0 30px;letter-spacing:1px}
.big.alt{background:#2b5fd9;font-size:18px;margin:6px 0}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%}
.f{display:flex;gap:10px;align-items:center;font:700 13px system-ui,sans-serif;margin:5px 0;flex-wrap:wrap}
.f select,.f input[type=number]{font:inherit;padding:4px;border-radius:6px;border:0;width:90px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.sel{border-color:#fff}
table{width:100%;border-collapse:collapse;font:700 14px system-ui,sans-serif}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.12)}tr.me{background:rgba(255,210,63,.25)}
.stat{display:inline-block;min-width:130px;margin:4px 14px 4px 0;font:600 12px system-ui,sans-serif;opacity:.95}.stat b{display:block;font:italic 900 22px "Arial Black",sans-serif;color:#ffd23f}

<div class="zone" id="zl"></div><div class="zone" id="zr"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const fmtT=t=>{if(!isFinite(t))return'--';const m=Math.floor(t/60),s=t-m*60;return(m?m+':'+(s<10?'0':''):'')+s.toFixed(2)};
const MPH=2.23694;
/* ============ data ============ */
const DISTS=[1000,2000,3000,5000,8000];
const DM={1000:.8,2000:.9,3000:.95,5000:1,8000:1.05};     // per-distance energy tuning
const E0={1000:.80,2000:.70,3000:.62,5000:.54,8000:.50};  // AI baseline effort per distance
const TERR={grass:{sp:1,cost:1,c:['#4fae3b','#47a436'],name:'Grass'},dirt:{sp:.99,cost:1.03,c:['#c9803f','#bd7536'],name:'Dirt'},mud:{sp:.86,cost:1.5,c:['#6d4b2a','#5f4023'],name:'Mud'},gravel:{sp:.95,cost:1.15,c:['#bcaaa3','#ad9b94'],name:'Gravel'},uneven:{sp:.97,cost:1.1,c:['#7aa83a','#6c9831'],name:'Uneven'}};
const COURSES=[
 {name:'Open Fields',unlock:0,desc:'Mostly flat grass with gentle rolling hills. Beginner friendly.',prof:[[1.3,150,0],[.8,70,1.7]],w:{grass:6,dirt:2,gravel:1,uneven:1},tree:.22,pine:0,sky:['#6fc1f0','#e4f6ff'],fg:'#3f8f2f'},
 {name:'Forest Trail',unlock:1,desc:'Dirt paths, sharp turns and rolling hills through the trees.',prof:[[2.0,115,.3],[1.2,58,2]],w:{dirt:6,grass:1.5,mud:1,uneven:1.5},tree:1,pine:0,turns:true,sky:['#8fd0ee','#e9f7e8'],fg:'#2f6f27'},
 {name:'Championship',unlock:3,desc:'Big open fields, several hills, mud pits and a brutal final climb.',prof:[[2.8,135,0],[1.8,78,1.2],[.9,42,.5]],w:{grass:4,dirt:1.5,mud:3,gravel:.5,uneven:1},tree:.45,pine:0,fin:true,sky:['#5aa8e6','#f1e9d2'],fg:'#3f8f2f'},
 {name:'Hilly Course',unlock:6,desc:'Long climbs and fast descents. Pace the uphills.',prof:[[3.0,190,0],[2.0,105,1],[.9,52,2]],w:{grass:3.5,dirt:3,gravel:1.5,mud:1,uneven:1},tree:.7,pine:1,sky:['#7aa9d8','#efe3d0'],fg:'#4a7a34'}
];
const ARCH=[{n:'Sprinter',sp:95,st:55,d:'Short races and finishing kicks'},{n:'Balanced',sp:75,st:75,d:'All-around performance'},{n:'Endurance',sp:60,st:95,d:'Holds pace over distance'},{n:'Finisher',sp:90,st:70,d:'Late-race acceleration'}];
const HAIR=[{n:'Short',u:0},{n:'Afro',u:2},{n:'Ponytail',u:4},{n:'Headband',u:0},{n:'Bandana crop',u:6}];
const USTY=[{n:'Singlet',u:0},{n:'Tee',u:0},{n:'Long sleeve',u:3},{n:'Striped',u:5}];
const SKINS=['#f1c27d','#c68642','#8d5524','#5a3825'];
const KITS=[{n:'Blue',s:'As in the video',top:'#1e50d8',shorts:'#1b2a6b'},{n:'Red',s:'Red & maroon',top:'#d92b2b',shorts:'#6b1b1b'},{n:'Green',s:'Green & forest',top:'#25a244',shorts:'#14532d'},{n:'Black',s:'Black & gold',top:'#2b2b2b',shorts:'#e8b923'}];
const NAMES=['Alvarez','Brooks','Chen','Dube','Eriksen','Fofana','Garcia','Haile','Ito','Jensen','Kamau','Lopez','Moore','Nakamura','Okafor','Patel','Quinn','Rossi','Singh','Tanaka','Ueda','Vega','Walker','Xu','Yilma','Zhou','Baker','Cole','Diaz','Evans'];
const PERS=['fast','cons','strat','hill','fin'];
const PERSN={fast:'Fast starter',cons:'Consistent',strat:'Strategic',hill:'Hill runner',fin:'Fast finisher'};
const TSC=['#d92b2b','#2b8ad9','#e8b923','#8e44ad','#16a085','#e67e22','#c0392b','#2c3e50','#f06292','#00acc1','#7cb342','#fb8c00'];
/* ============ persistent settings ============ */
const DEF={dist:5000,course:0,style:'tactical',diff:5,arch:1,ts:3,mode:'quick',model:0,kit:0,hair:3,skin:'#c68642',top:'#1e50d8',shorts:'#1b2a6b',ustyle:0,shoes:'#f2f2f2',bib:7,races:0,pb:{},thr:70};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('ccs2')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('ccs2',JSON.stringify(S))}catch(e){}}
/* ============ course ============ */
let CUR=COURSES[0],SEGS=[{a:0,b:9e9,t:'grass'}],RACE={D:5000,style:'tactical',diff:5,mode:'quick'};
function buildSegs(ci){const C=COURSES[ci],r=rng(1000+ci*77),keys=Object.keys(C.w),tot=keys.reduce((a,k)=>a+C.w[k],0),segs=[];let x=0;
 while(x<8900){let q=r()*tot,k=keys[0];for(const kk of keys){q-=C.w[kk];if(q<=0){k=kk;break}}const len=90+r()*210;segs.push({a:x,b:x+len,t:k});x+=len}
 segs[0].t=C.w.grass?'grass':'dirt';return segs}
function terrAt(d){let lo=0,hi=SEGS.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(SEGS[m].a<=d)lo=m;else hi=m-1}return SEGS[lo].t}
function elev(d){let h=0;for(const p of CUR.prof)h+=p[0]*Math.sin(d*6.2832/p[1]+p[2]);h*=clamp(d/90,0,1)*.9;
 if(CUR.fin){const u=(d-(RACE.D-650))/260;if(u>0&&u<1)h+=4.5*Math.sin(u*Math.PI)}return h}
function grade(d){return clamp((elev(d+1.5)-elev(d-1.5))/3,-.16,.16)}
function isTurn(d){return !!CUR.turns&&(d%480)>300&&(d%480)<345}
/* ============ runners ============ */
function newRig(){return{w:0,corr:0,off:0,phi:0,th:[.2,-.2],thv:[0,0],kn:[.4,.4],knv:[0,0],ar:[0,0],arv:[0,0],el:[1.2,1.2],elv:[0,0],ft:[1.4,1.4],ftv:[0,0],hl:0,hlv:0}}
function mkRunner(o){return Object.assign({x:0,v:0,E:100,fat:0,cad:0,cadE:0,eff:0,kick:false,fin:false,ft:0,maxv:0,stumble:0,rhy:1,lean:.12,leanv:0,post:0,tapErr:0,rig:newRig(),lane:0,react:0,noise:0,nt:0,rec:false,recNow:false,holdN:0,cadCmd:0,sp:70,st:70,tq:.8,pts:0},o)}
function genAI(i,diff,R){const pers=PERS[i%5];let sp=50+diff*3.5+(R()-.5)*26,st=50+diff*3.5+(R()-.5)*26;
 if(pers==='fast'){sp+=8;st-=8}if(pers==='strat')st+=6;if(pers==='fin')sp+=6;if(pers==='hill')st+=4;
 return{name:NAMES[(i*7+3)%NAMES.length],sp:clamp(Math.round(sp),30,98),st:clamp(Math.round(st),30,98),pers,skill:.89+.0145*diff+(R()-.5)*.04,num:10+((i*13)%89),col:TSC[i%TSC.length],pts:0}}
/* ============ game state ============ */
let state='menu',P,runners=[],clockT=0,readyT=0,gunAt=3,TS=3,finT=0,champ=null,flashes=[];
const PPM=26,VX=3.2;
const held=[new Set(),new Set()],pressT=[null,null];
let camD=0,camE=0;
function kickZone(){return Math.min(800,.2*RACE.D)}
function kickAvail(r){return state==='race'&&!r.fin&&RACE.D-r.x<=kickZone()&&r.E>6}
function flash(t,col){flashes.push({t,col:col||'#fff',age:0})}
function buildRace(){
 CUR=COURSES[S.course];SEGS=buildSegs(S.course);TS=S.ts;
 RACE={D:S.dist,style:S.style,diff:S.diff,mode:S.mode,course:S.course};
 const a=ARCH[S.arch];P=mkRunner({sp:a.sp,st:a.st,isP:true,lane:7,name:'You',num:S.bib,cad:0});
 runners=[P];
 if(S.mode==='quick'||S.mode==='champ'){
  let list;
  if(S.mode==='champ'){list=champ.ais}else{const n=S.dist>=5000?24:S.dist>=3000?18:14,R=rng(Date.now()&0xffff);list=[];for(let i=0;i<n;i++)list.push(genAI(i,S.diff,R))}
  list.forEach((o,i)=>{const mg=.25+.075*S.diff;runners.push(mkRunner({isP:false,o,name:o.name,num:o.num,col:o.col,sp:o.sp,st:o.st,lane:i%7,react:.15+Math.random()*.25,rigOff:Math.random()*6.283,
   kickAt:Math.max(80,Math.min(800,.2*S.dist)*(.3+.45*mg+(o.pers==='fin'?.25:0))*(.8+.4*Math.random()))}))});
 }
 runners.forEach(q=>{if(q.rigOff!=null)q.rig.off=q.rigOff});P.pr=0;P.lastTapT=0;P.lastSide=-1;P.jit=.15;P.react=0;
 held[0].clear();held[1].clear();pressT[0]=pressT[1]=null;
 clockT=0;readyT=0;gunAt=2.6+Math.random()*1.6;state='ready';flashes=[];camD=-8;camE=0;finT=0;
 $('#menu').style.display='none';$('#results').style.display='none';
 ['#brestart','#bexit'].forEach(s=>$(s).style.display='block');
 $('#prac').style.display=S.mode==='practice'?'block':'none';
 const touch=isTouch();['#zl','#zr'].forEach(s=>$(s).style.display='block');
 ['#pl','#pr'].forEach(s=>$(s).style.display=touch?'flex':'none');$('#kick').style.display=touch?'block':'none';
}
function isTouch(){return('ontouchstart' in window)||(navigator.maxTouchPoints>0)}
/* ============ input ============ */
function nowS(){return performance.now()/1000}
function tap(side){
 if(state==='ready'){if(readyT>1.2){P.stumble=.9;flash('FALSE START','#ff5a5a')}return}
 if(state!=='race'||P.fin)return;
 const t=nowS();
 if(P.lastSide===side){P.stumble=.35;flash('SAME LEG','#ffb347');return}
 const dt=P.lastTapT?t-P.lastTapT:9;
 if(dt<.085){P.stumble=Math.max(P.stumble,.15);return}
 let e0=.5;if(dt<1.3){const pa=P.cad>0?1/P.cad:dt;e0=Math.min(1,Math.abs(dt-pa)/pa)}
 P.tapErr=e0;
 if(dt<1.3){const inst=1/dt;P.cad=P.cad>0?P.cad*.55+inst*.45:inst*.7;const avg=1/Math.max(P.cad,.5);P.jit=P.jit*.7+Math.min(1,Math.abs(dt-avg)/avg)*.3}
 else{P.cad=1.8;P.jit=.15}
 P.cad=Math.min(P.cad,7);P.lastTapT=t;P.lastSide=side;
 const g=P.rig,e=Math.round(g.phi/Math.PI)*Math.PI-g.phi;if(Math.abs(e)<Math.PI*.5)g.corr=e*.35;P.leanv+=(Math.random()<.5?-1:1)*(.18+1.5*e0+.08*Math.min(1,P.cadE/7))*(1+P.fat/100*.6)+.05;
}
function down(side,id){held[side].add(id);if(pressT[side]==null)pressT[side]=nowS();$(side?'#pr':'#pl').classList.add('on');tap(side)}
function up(side,id){held[side].delete(id);if(!held[side].size){pressT[side]=null;$(side?'#pr':'#pl').classList.remove('on')}}
function releaseAll(){for(const s of[0,1]){held[s].clear();pressT[s]=null}}
function toggleKick(){if(state==='race'&&!P.fin){if(P.kick)P.kick=false;else if(kickAvail(P)){P.kick=true;flash('KICK!','#ffd23f')}}}
const KEYS={KeyA:0,ArrowLeft:0,KeyD:1,ArrowRight:1};
addEventListener('keydown',e=>{if(e.code in KEYS){e.preventDefault();if(!e.repeat&&state!=='menu')down(KEYS[e.code],e.code)}
 else if(e.code==='Space'||e.code==='KeyK'){e.preventDefault();if(!e.repeat)toggleKick()}
 else if(e.code==='KeyR'&&state!=='menu'&&!e.repeat)restart();else if(e.code==='Escape'&&state!=='menu')exitToMenu()});
addEventListener('keyup',e=>{if(e.code in KEYS)up(KEYS[e.code],e.code)});
addEventListener('blur',releaseAll);
function bindZone(el,side){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}down(side,'p'+e.pointerId)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>up(side,'p'+e.pointerId)))}
bindZone($('#zl'),0);bindZone($('#zr'),1);
$('#kick').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleKick()});
['touchmove','gesturestart','gesturechange','contextmenu','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(state==='ready'||state==='race'||state==='finish')e.preventDefault()},{passive:false}));
$('#brestart').onclick=()=>restart();$('#bexit').onclick=()=>exitToMenu();
$('#resetE').onclick=()=>{P.E=100;P.fat=0};
function restart(){if(S.mode==='champ'&&champ&&champ.round>0&&state!=='menu'){}buildRace()}
function exitToMenu(){state='menu';releaseAll();['#zl','#zr','#pl','#pr','#kick','#brestart','#bexit','#prac'].forEach(s=>$(s).style.display='none');$('#results').style.display='none';showMenu()}
/* ============ physics ============ */
function phys(r,dt,cad,leanT,env){
 const ds=dt*TS,eff=clamp((cad-1.5)/3.6,0,1.3),T=TERR[env.t];r.eff=eff;
 r.leanv+=((leanT-r.lean)*26-r.leanv*7)*dt;r.lean+=r.leanv*dt;r.lean=clamp(r.lean,-.5,1.25);
 let slope=env.g>0?1-2.6*env.g:1-1.4*env.g;slope=clamp(slope,.62,1.2);
 let em=1-r.fat/100*.24;if(r.E<30)em*=.72+.28*r.E/30;
 let km=1;if(r.kick){const pw=.02+.16*Math.pow(r.sp/100,1.5);km=1+pw*clamp(r.E/45,.2,1)*(1-r.fat/100*.45)}
 const lm=(1-clamp((r.lean-.3)/.4,0,1)*.38)*(.955+.075*(r.post||0));   // over-lean costs speed; held posture earns it back
 const un=env.t==='uneven'?(.965+.035*Math.sin(r.x*1.7)):1;
 const f=1-Math.exp(-cad/2.3);
 let vt=(7.6+.032*r.sp)*f*T.sp*slope*em*km*lm*r.rhy*un*(env.turn?.95:1)*(r.stumble>0?.85:1);
 if(env.g<-.08&&eff>.7)vt*=.97;
 if(vt>r.v)r.v=Math.min(vt,r.v+(2.5+1.4*r.sp/100)*dt);else r.v=Math.max(vt,r.v-(cad<.6?2.4:3.4)*dt);
 r.x+=r.v*ds;if(r.v>r.maxv)r.maxv=r.v;
 /* energy */
 const sf=1.28-.0075*r.st;
 let dr=3*Math.pow(Math.max(0,eff-.3),2)*sf*DM[RACE.D]*T.cost*(1+Math.max(0,env.g)*9)*(1+r.fat/100*.8);
 if(env.g<0)dr*=clamp(1+env.g*4,.4,1);
 dr*=1+r.holdN*.15;
 if(r.kick)dr+=1.6*(1.2-r.st/200);
 r.recNow=false;

 c.save();c.translate(KX,KY);c.rotate(rs);c.translate(-K[0],-K[1]);rpDot(c,K[0],K[1],30,col);rpPiece(c,atl,'shin');c.restore();
 const cs=Math.cos(rs),sn=Math.sin(rs),bx=B[0]-K[0],by=B[1]-K[1];

}

 {const S=RP.S0,E=RP.E0,ua=.95*g.ar[0],ru=RP.UA0-ua,cu=Math.cos(ru),su=Math.sin(ru),ex=E[0]-S[0],ey=E[1]-S[1],EX=S[0]+ex*cu-ey*su,EY=S[1]+ex*su+ey*cu;

  else{c.fillStyle=hash(i*13)>.5?'#3b8a35':'#4a9a3c';c.beginPath();c.arc(x,y-hgt*.62,hgt*.3,0,6.3);c.arc(x-hgt*.18,y-hgt*.45,hgt*.22,0,6.3);c.arc(x+hgt*.18,y-hgt*.45,hgt*.22,0,6.3);c.fill()}}
 // crowd + flags near start/finish
 const crowd=(a,b)=>{for(let d=a;d<b;d+=1.6){if(d<d0||d>d1)continue;for(let row=0;row<3;row++){const h=hash(d*3+row);c.fillStyle=TSC[(h*12)|0];c.beginPath();c.arc(sx(d)+row*5,top(d)-(3+row*9)*u,4.5*u,0,6.3);c.fill()}}};
 crowd(-30,45);crowd(RACE.D-40,RACE.D+90);
 // distance signs
 for(let d=Math.ceil(d0/250)*250;d<=Math.min(d1,RACE.D);d+=250){const rem=RACE.D-d;if(rem<=0)continue;const x=sx(d),y=top(d);c.fillStyle='#fff';c.fillRect(x-1,y-34*u,2,34*u);c.fillRect(x-24*u,y-48*u,48*u,16*u);c.fillStyle='#111';c.font=`bold ${11*u}px Arial`;c.textAlign='center';c.fillText(rem>=1000?(rem/1000)+'K to go':rem+'m',x,y-36*u);
  if(CUR.turns){}}
 // turn signs
 if(CUR.turns)for(let b=Math.floor(d0/480)*480+300;b<d1;b+=480){if(b<d0-50||b>RACE.D)continue;const x=sx(b),y=top(b);c.fillStyle='#f5c518';c.fillRect(x-1,y-40*u,2,40*u);c.fillRect(x-20*u,y-58*u,40*u,20*u);c.fillStyle='#111';c.font=`bold ${15*u}px Arial`;c.textAlign='center';c.fillText('↰',x,y-42*u)}
 // ground & track
 const stepx=14;let xs=[];for(let x=-stepx;x<=W+stepx;x+=stepx)xs.push(x);
 for(let k=0;k<xs.length-1;k++){const xa=xs[k],xb=xs[k+1],da=camD+xa/PPM,db=camD+xb/PPM,ya=top(da),yb=top(db),t=terrAt((da+db)/2),col=TERR[t].c[(Math.floor((da)/6)&1)];
  c.fillStyle=CUR.fg;c.beginPath();c.moveTo(xa,ya+LH*NL);c.lineTo(xb,yb+LH*NL);c.lineTo(xb+1,H+2);c.lineTo(xa,H+2);c.fill();
  c.fillStyle=col;c.beginPath();c.moveTo(xa,ya);c.lineTo(xb+1,yb);c.lineTo(xb+1,yb+LH*NL);c.lineTo(xa,ya+LH*NL);c.fill();
  if(t==='mud'){c.fillStyle='rgba(30,15,5,.35)';c.fillRect(xa+3,ya+LH*(2+(k%5)),9,3)}
  if(t==='gravel'){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(xa+2,ya+LH*(1+(k*3%6)),3,2)}}
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=Math.max(1,1.4*u);
 for(let l=0;l<=NL;l++){c.beginPath();for(let k=0;k<xs.length;k++){const y=top(camD+xs[k]/PPM)+l*LH;k?c.lineTo(xs[k],y):c.moveTo(xs[k],y)}c.stroke()}
 // track top edge shadow
 c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2*u;c.beginPath();for(let k=0;k<xs.length;k++){const y=top(camD+xs[k]/PPM)-1;k?c.lineTo(xs[k],y):c.moveTo(xs[k],y)}c.stroke();
 // start & finish
 const band=(d,col)=>{const x=sx(d);if(x<-40||x>W+40)return;const yA=top(d),yB=top(d+.6);c.fillStyle=col;c.beginPath();c.moveTo(x,yA);c.lineTo(x+9*u,yB);c.lineTo(x+9*u,yB+LH*NL);c.lineTo(x,yA+LH*NL);c.fill()};
 band(0,'#fff');
 const fx=sx(RACE.D);if(fx>-100&&fx<W+100){const yA=top(RACE.D),yB=top(RACE.D+.6);
  for(let q=0;q<NL*2;q++){c.fillStyle=q%2?'#fff':'#111';c.beginPath();c.moveTo(fx,yA+q*LH/2);c.lineTo(fx+10*u,yB+q*LH/2);c.lineTo(fx+10*u,yB+(q+1)*LH/2);c.lineTo(fx,yA+(q+1)*LH/2);c.fill()}
  c.fillStyle='#ddd';c.fillRect(fx-3,yA-120*u,6,120*u);c.fillRect(fx+4+80*u,yA-120*u,6,120*u);
  c.fillStyle='#d92b2b';c.fillRect(fx-3,yA-125*u,94*u,32*u);c.fillStyle='#fff';c.font=`italic 900 ${22*u}px Arial Black,Impact,sans-serif`;c.textAlign='center';c.fillText('FINISH',fx+44*u,yA-101*u)}
 // runners
 const vis=runners.filter(r=>{const x=sx(r.x);return x>-120&&x<W+120}).sort((a,b)=>a.lane-b.lane||(a.isP?1:0)-(b.isP?1:0));
 for(const r of vis){
  const x=sx(r.x),ty=top(r.x),ty2=top(r.x+.5),ty1=top(r.x-.5),ang=Math.atan2(ty2-ty1,PPM),y=ty+(r.lane+.5)*LH,s=u*(.62+.07*r.lane)*(r.isP?1.06:1);

  stepRig(r,FDT,crouch?'crouch':'run');

 }
}
function textO(c,t,x,y,font,fill,w,al){c.font=font;c.textAlign=al||'left';c.lineJoin='round';c.lineWidth=w||4;c.strokeStyle='#111';c.strokeText(t,x,y);c.fillStyle=fill;c.fillText(t,x,y)}
function drawHud(c){
 const u=clamp(H/720,.6,1.3),fi=`italic 900 ${22*u}px "Arial Black",Impact,sans-serif`;
 const bw=Math.min(300*u,W*.4),bx=W-bw-14,r=P;
 // oval time/mph
 const ow=Math.min(320*u,W*.45),ox=W-ow-10,oy=8,oh=62*u;
 const og=c.createLinearGradient(0,oy,0,oy+oh);og.addColorStop(0,'#3a6fe0');og.addColorStop(1,'#1e3f9a');c.fillStyle=og;c.beginPath();c.roundRect?c.roundRect(ox,oy,ow,oh,oh/2):c.rect(ox,oy,ow,oh);c.fill();c.lineWidth=3;c.strokeStyle='#fff';c.stroke();
 textO(c,fmtT(state==='ready'?0:r.fin?r.ft:clockT),ox+ow*.08,oy+oh*.66,`italic 900 ${28*u}px "Arial Black",sans-serif`,'#fff',5);
 textO(c,(r.v*MPH).toFixed(1)+' mph',ox+ow*.92,oy+oh*.66,`italic 900 ${24*u}px "Arial Black",sans-serif`,'#ff3030',5,'right');
 // energy

 if(r.recNow){c.fillStyle='rgba(255,255,255,'+(.25+.2*Math.sin(performance.now()/120))+')';c.fillRect(bx,ey,bw*r.E/100,bh)}
 c.strokeStyle='#111';c.lineWidth=3;c.strokeRect(bx,ey,bw,bh);c.fillStyle='rgba(255,255,255,.8)';c.fillRect(bx+bw*S.thr/100-1,ey,2,bh);
 textO(c,'Energy: '+Math.round(r.E),bx+bw/2,ey+bh*.8,`italic 900 ${19*u}px "Arial Black",sans-serif`,'#fff',4,'center');
 if(r.recNow)textO(c,'▲ recovering',bx-8,ey+bh*.8,`italic 900 ${14*u}px sans-serif`,'#7CFF6B',3,'right');
 const cy=ey+bh+8*u,cg=c.createLinearGradient(bx,0,bx+bw,0);cg.addColorStop(0,'#c9b8ff');cg.addColorStop(.6,'#ffb066');cg.addColorStop(1,'#ff5a1e');
 c.fillStyle='#222';c.fillRect(bx,cy,bw,bh);c.fillStyle=cg;c.fillRect(bx,cy,bw*clamp(r.cadE/6,0,1),bh);c.strokeRect(bx,cy,bw,bh);
 textO(c,'Cadence: '+r.cadE.toFixed(1),bx+bw/2,cy+bh*.8,`italic 900 ${19*u}px "Arial Black",sans-serif`,'#fff',4,'center');
 c.font=`${30*u}px sans-serif`;c.textAlign='right';c.fillText('🔥',bx-4,cy+bh*.9);
 // fatigue + effort
 const fy=cy+bh+8*u;c.fillStyle='#222';c.fillRect(bx,fy,bw,10*u);c.fillStyle='#b04ad9';c.fillRect(bx,fy,bw*r.fat/100,10*u);c.strokeRect(bx,fy,bw,10*u);
 const eff=r.eff<.3?'EASY':r.eff<.55?'MODERATE':r.eff<.8?'HARD':'MAX';
 textO(c,`Fatigue ${Math.round(r.fat)}%  ·  Effort: ${eff}`,bx+bw,fy+30*u,`italic 900 ${14*u}px sans-serif`,'#fff',3,'right');
 const pyb=fy+38*u,ph=16*u;c.fillStyle='#222';c.fillRect(bx,pyb,bw,ph);c.fillStyle=r.post>.6?'#38e0c8':r.post>.25?'#e8d34a':'#8a8a8a';c.fillRect(bx,pyb,bw*r.post,ph);c.strokeStyle='#111';c.lineWidth=3;c.strokeRect(bx,pyb,bw,ph);
 textO(c,'Posture '+Math.round(r.post*100)+'%',bx+bw/2,pyb+ph*.82,`italic 900 ${12*u}px sans-serif`,'#fff',3,'center');
 // lean warning
 if(r.lean>.32&&state==='race')textO(c,'LEANING TOO FAR – LIFT YOUR THUMB',bx+bw,pyb+ph+22*u,`italic 900 ${14*u}px sans-serif`,'#ff9a3c',3,'right');
 // centre top: distance / position
 const rem=Math.max(0,RACE.D-r.x),cx=W/2;
 textO(c,Math.round(rem).toLocaleString()+' m to go',cx-W*.06,30*u,`italic 900 ${24*u}px "Arial Black",sans-serif`,'#fff',5,'center');
 const T=TERR[terrAt(r.x)],g=grade(r.x);
 textO(c,`${T.name} ${g>.012?'▲':g<-.012?'▼':'—'} ${Math.abs(g*100).toFixed(0)}%${isTurn(r.x)?'  ·  TURN':''}`,cx-W*.06,54*u,`italic 900 ${15*u}px sans-serif`,'#ffe9a0',4,'center');
 if(runners.length>1)textO(c,'Pos '+rank(r)+' / '+runners.length,cx-W*.06,78*u,`italic 900 ${18*u}px "Arial Black",sans-serif`,'#ffd23f',4,'center');
 // minimap
 const mx=W*.18,mw=W*.5-mx+W*.1,my=H-12*u;
 if(H>380){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(mx,my-4,mw,8);for(const q of runners){c.fillStyle=q.isP?'#ffd23f':'#fff';c.beginPath();c.arc(mx+mw*clamp(q.x/RACE.D,0,1),my,q.isP?6:3,0,6.3);c.fill()}}
 // kick status
 if(state==='race'){const av=kickAvail(r);if(r.kick)textO(c,'KICK ACTIVE',W/2,H*.2,`italic 900 ${28*u}px "Arial Black",sans-serif`,'#ffd23f',5,'center');else if(av)textO(c,'KICK READY – SPACE'+(isTouch()?' / KICK':''),W/2,H*.2,`italic 900 ${22*u}px "Arial Black",sans-serif`,'#ffd23f',5,'center');
  $('#kick').classList.toggle('dim',!av&&!r.kick);$('#kick').textContent=r.kick?'KICK ON':'KICK'}
 // flashes
 for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.age+=FDT;if(f.age>1.2){flashes.splice(i,1);continue}c.globalAlpha=1-f.age/1.2;textO(c,f.t,W/2,H*.3-f.age*30,`italic 900 ${36*u}px "Arial Black",sans-serif`,f.col,6,'center');c.globalAlpha=1}
 // on your marks
 if(state==='ready'){
  const cx2=W/2,cy2=H*.28,rr=Math.min(H*.2,110*u*1.3);
  c.fillStyle='#4aa83a';for(let s=-1;s<=1;s+=2)for(let i=0;i<9;i++){const a=Math.PI*(.62+i*.095)*s+(s>0?0:Math.PI),ax=cx2+Math.cos(i*.33+.5)*0;const t=-1.3+i*.32;const px=cx2+s*rr*Math.cos(t+.15)*.95,py=cy2+rr*Math.sin(t)*.95;c.save();c.translate(px,py);c.rotate(t*s+(s>0?.2:Math.PI-.2));c.beginPath();c.ellipse(0,0,rr*.2,rr*.075,0,0,6.3);c.fill();c.restore()}
  const word=readyT<1.2?['ON YOUR','MARKS']:['SET',''];
  textO(c,word[0],cx2,cy2-4*u,`italic 900 ${34*u}px "Arial Black",sans-serif`,'#b46ae8',6,'center');if(word[1])textO(c,word[1],cx2,cy2+34*u,`italic 900 ${34*u}px "Arial Black",sans-serif`,'#e8408c',6,'center');
  textO(c,S.mode==='practice'?'Free run!':(RACE.D/1000)+'K race!',cx2,cy2+rr+26*u,`italic 900 ${40*u}px "Arial Black",sans-serif`,'#ffd23f',7,'center');
  textO(c,'Alternate A / D or ← / → (or tap left / right)  ·  Even, crisp taps hold your posture  ·  Sloppy timing or long holds throw you off balance',cx2,H-18*u,`italic 700 ${13*u}px sans-serif`,'#fff',4,'center');
 }
 if(state==='finish')textO(c,'FINISH!',W/2,H*.3,`italic 900 ${60*u}px "Arial Black",sans-serif`,'#ffd23f',8,'center');
}
function draw(){
 const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);
 if(state==='menu'||state==='results'&&false){c.fillStyle='#0c1018';c.fillRect(0,0,W,H);return}
 camD=lerp(camD,P.x+P.v*.12-W*.3/PPM,state==='ready'?1:.35);

/* ============ main loop ============ */
let last=0,acc=0,FDT=.016;const STEP=1/120;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.1,(t-last)/1000||0);last=t;FDT=dt>0?Math.min(dt,.05):.016;acc+=dt;let n=0;while(acc>=STEP&&n<20){update(STEP);acc-=STEP;n++}if(n>=20)acc=0;if(state!=='menu')draw();else if(mprev)drawPreview()}
requestAnimationFrame(frame);

let mprev=null;
function chips(key,opts,sel,fmt){return opts.map(o=>`<div class="chip ${o.v===sel?'sel':''} ${o.lock?'lock':''}" data-k="${key}" data-v="${o.v}">${o.l}${o.s?`<small>${o.s}</small>`:''}</div>`).join('')}
const DIFFN=d=>d<=2?'VERY EASY':d<=4?'EASY':d<=6?'NORMAL':d<=8?'HARD':'ELITE';

 el.innerHTML=`<div class="wrap"><h1>CROSS COUNTRY <span>STARS</span></h1><div class="sub">Rhythm running on hills, mud and trails. Races completed: ${S.races}</div>

 <div class="desc">${{quick:'Pick a distance and course and race a pack of AI runners.',time:'Run alone and chase your personal best.',champ:'Three races across different courses. Points for the top 8 finishers.',practice:'Practice your rhythm with no competition. Energy can be locked.'}[S.mode]}</div></div>
 <div class="grid2"><div class="card"><h3>DISTANCE</h3><div class="row">${chips('dist',DISTS.map(d=>({v:d,l:d/1000+'K'})),S.dist)}</div>
 <div class="desc">1K allows more sustained high effort · 5K rewards steady pacing · 8K demands deliberate energy management.</div></div>

 <div class="grid2"><div class="card"><h3>RACE STYLE</h3><div class="row">${chips('style',[{v:'tactical',l:'Tactical Race'},{v:'fast',l:'Fast-Paced Race'}],S.style)}</div>
 <div class="desc">${S.style==='tactical'?'Controlled start, compact pack, energy conservation. Moves come in the middle and the final stretch, ending in a fast kick.':'Aggressive start and higher average pace. More passing and position changes, but it costs more energy and fatigue.'}</div></div>
 <div class="card"><h3>OVERALL DIFFICULTY: <span id="dlab">${S.diff} · ${DIFFN(S.diff)}</span></h3><input type="range" id="diff" min="1" max="10" step="1" value="${S.diff}">

 <div class="grid2"><div class="card"><h3>RUNNER</h3><div class="row">${ARCH.map((a,i)=>`<div class="chip ${i===S.arch?'sel':''}" data-k="arch" data-v="${i}">${a.n}<small>SPD ${a.sp} · STA ${a.st}</small></div>`).join('')}</div>
 <div class="desc">${ARCH[S.arch].d}</div>
 <div class="desc">Speed<div class="bar"><i style="width:${ARCH[S.arch].sp}%;background:#ff6a3c"></i></div>Stamina<div class="bar"><i style="width:${ARCH[S.arch].st}%;background:#3ccf6a"></i></div></div></div>
 <div class="card"><h3>LOOK</h3><div style="display:flex;gap:14px;align-items:center"><canvas id="prev" width="170" height="210" style="position:static;width:110px;height:136px;background:rgba(255,255,255,.08);border-radius:10px;flex:none"></canvas><div><div class="desc">Pixel runner from your sprite sheet (side view). Your runner is marked with a yellow arrow above their head during races.</div></div></div></div></div>
 <div class="card"><h3>RACE TIME SCALE</h3><div class="row">${chips('ts',[{v:1,l:'1× real time'},{v:2,l:'2×'},{v:3,l:'3×'},{v:4,l:'4×'}],S.ts)}</div>

 <div class="sub">Controls: A / D or ← / → alternate legs · Space = finishing kick · R restart · Esc menu · Mobile: tap left / right side, KICK button.</div></div>`;
 el.style.display='block';state='menu';

showMenu();
